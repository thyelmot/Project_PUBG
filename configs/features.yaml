# Feature engineering configuration and registry parameters

feature_versions:
  schema_version: 1
  feature_version: 1
  pipeline_version: 1

combat_timing:
  enabled: true
  early_cutoff: 0.3333333333
  mid_cutoff: 0.6666666667
  min_valid_duration_seconds: 60.0
  min_valid_duration_status: "verified"
  min_valid_duration_evidence: "User selected A on 2026-10-08: retain 60 seconds as a declared convention. Full-ledger threshold_sensitivity.csv: thresholds 1/30/60/120/180 yield 59560628 phase events; this does not identify a unique optimal threshold. See reports/appendix/nb04_completion_review_2026-10-08/decision_A.md."
  event_time_unit_status: "verified"
  event_time_unit_evidence: "Full-data consistency audit: 65370475 joined rows, 64851649 matched victims; 64441869 differ from survival by <=1, 64452071 by <=5; multiplying event time by1000 gives zero matches within5. Retain seconds interpretation based on consistency, not independently documented source units; preserve abnormal source values. See event_survival_unit_consistency.csv and decision_A.md in reports/appendix/nb04_completion_review_2026-10-08."
  enemy_kill_eligibility_status: "verified"
  enemy_kill_eligibility_evidence: "User selected A on 2026-10-08: retain credited-killer non-self semantics, including 691828 same-team and 795303 unknown-team absolute-eligible events. This historical gate name records an accepted eligibility decision; it is NOT a confirmed enemy-only claim. Team/cause cross-tab covers all 65370475 events. See reports/appendix/nb04_completion_review_2026-10-08/decision_A.md."

transforms:
  log_transform_features: [] # TBD: Decided in EDA (Notebook 05)
  standardize: true

groups:
  combat:
    - player_kills
    - player_dmg
    - damage_per_kill
  movement:
    - player_dist_walk
    - player_dist_ride
    - total_distance
    - walk_ratio
  support:
    - player_assists
    - player_dbno
    - assist_ratio
  combat_timing_absolute:
    - event_kill_count
    - first_kill_time
    - avg_kill_time
    - has_kill
  combat_timing_phase:
    - early_kills
    - mid_kills
    - late_kills
    - early_kill_ratio
    - mid_kill_ratio
    - late_kill_ratio
  target_derived_diagnostics:
    - kills_per_minute
    - damage_per_minute
    - walk_velocity
    - ride_velocity

