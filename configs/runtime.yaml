# Runtime and execution settings

mode: "full" # All valid data; this label does not enable automatic sampling.
random_state: 42
chunk_size: 50000
storage_backend: "local" # "local" or "colab"
resume: true

duckdb:
  threads: 2
  memory_limit: "2GB"
  temp_directory: "./artifacts/logs/temp"

logging:
  level: "INFO"
  log_to_file: true
  log_to_console: true
  log_dir: "./artifacts/logs"
