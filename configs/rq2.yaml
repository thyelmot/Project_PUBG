# RQ2: Player Behavioral Profiling and Clustering

minimum_games_threshold: null # TBD: Decided in Notebook 07 based on retention & stability
min_games_candidates: [5, 10, 20, 50]

profile_level: "auto" # "overall", "per_mode", or "player_mode" - Decided after Mode EDA
mode_strategy: "per_mode" # TBD: Decided after Mode EDA (Notebook 05)
mode_decision_reason: "User selected per_mode: fit separate behavioral clusters for each team-size mode; retain notebook 05 EDA as evidence."
device: "cuda" # Explicit CPU opt-in: cpu. CUDA errors stop, never silently fall back.
party_size_mapping: null # Explicitly verified mapping, e.g. {1: Solo, 2: Duo, 4: Squad}
selection_reason: null # Record retention/stability and K diagnostic evidence
n_clusters_by_mode:
  Solo: 3
  Duo: 3
  Squad: 4 # Required instead of n_clusters when mode_strategy is per_mode

n_clusters: null # TBD: Selected from diagnostics in Notebook 07
candidate_k_range: [2, 3, 4, 5, 6, 7, 8]

algorithm: "kmeans"
batch_size: 10000
scaler: "standard" # standard / robust (robust as sensitivity)
random_state: 42

experiments:
  c1_main_clustering: true
  c2_hierarchical_validation: true # subset or centroids diagnostic
  c3_games_played_sensitivity: true # with vs without games_played
  c4_min_games_sensitivity: true # across candidate thresholds
  c5_outcome_comparison: true # post-clustering descriptive comparison ONLY
