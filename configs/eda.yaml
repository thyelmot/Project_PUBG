# Exploratory Data Analysis & Visualization Catalog (A01 - I03)
# Aligned with PUBG_RESEARCH_SPEC.md Section 26 & Section 27

sampling:
  viz_sample_size: 50000
  diagnostic_sample_size: 100000
  random_state: 42

scope:
  analysis_scope: "development"
  full_descriptive_locked: false
  allowed_development_splits: ["train", "validation"]

decisions:
  log_transform_status: "pending_real_data_evidence"
  log_transform_features: []
  log_transform_reason: "Chờ skewness, tail diagnostics và validation evidence; fixture chỉ kiểm thử cơ chế."
  outlier_policy: "diagnose_only_no_automatic_row_removal"

catalog:
  structural:
    - id: "A01"
      name: "distribution_of_matches_per_player"
    - id: "A02"
      name: "player_retention_curve"
    - id: "A03"
      name: "matches_by_mode_distribution"
    - id: "A04"
      name: "game_size_distribution"
    - id: "A05"
      name: "teams_per_match_distribution"
    - id: "A06"
      name: "temporal_coverage_and_match_frequency"

  raw_distributions:
    - id: "B01"
      name: "kills_distribution"
    - id: "B02"
      name: "damage_distribution"
    - id: "B03"
      name: "assists_distribution"
